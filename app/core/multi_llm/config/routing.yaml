# app/core/multi_llm/config/routing.yaml
# All routes point to DeepInfra. No Ollama entries.

default_provider: deepinfra

routes:
  embedding:
    primary:
      provider: deepinfra
      model: ${MODEL_EMBEDDING}

  intent:
    primary:
      provider: deepinfra
      model: ${MODEL_INTENT}

  extraction:
    primary:
      provider: deepinfra
      model: ${MODEL_EXTRACTION}

  nl_to_cypher:
    primary:
      provider: deepinfra
      model: ${MODEL_NL_TO_CYPHER}

  reranking:
    primary:
      provider: deepinfra
      model: ${MODEL_RERANKER}

  memory:
    primary:
      provider: deepinfra
      model: ${MODEL_MEMORY}

  answer:
    primary:
      provider: deepinfra
      model: ${MODEL_ANSWER}

  vision:
    primary:
      provider: deepinfra
      model: ${MODEL_VISION}

  default:
    primary:
      provider: deepinfra
      model: ${MODEL_ANSWER}

providers:
  deepinfra:
    base_url: ${DEEPINFRA_API_URL}
    api_key_env: DEEPINFRA_API_KEY
    timeout_s: 120
    max_retries: 3
  # ollama: REMOVED — do not re-add
