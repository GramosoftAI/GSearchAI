version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: graphmind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphmind
      POSTGRES_PASSWORD: graphmind_password
      POSTGRES_DB: graphmind
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - graphmind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphmind -d graphmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: graphmind-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/graphmind_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "graphmind_password", "RETURN 1"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 60s
    networks:
      - graphmind-network

  # ============================================================================
  # Redis: Cache and session management
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: graphmind-redis
    command: redis-server --requirepass graphmind_redis_password --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"  
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphmind-network



networks:
  graphmind-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  redis_data: